<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1364" width="1000" height="1364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>The edshield agent loop</title>
  <desc>Two Claude Code agents measure edshield, diagnose what still gets through, change it and measure again. Shared state lives on GitHub. A pinned judge, a regression check, a sealed set and a person gate every candidate.</desc>
  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#e8923a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="s-orange" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#e8923a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2f8f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="s-green" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#2f8f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3b78d8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="s-blue" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#3b78d8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#cf3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="s-red" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#cf3b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7b55c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="s-purple" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#7b55c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect width="1000" height="1364" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="72" text-anchor="middle" font-size="54" font-weight="800" fill="#101a3d">The edshield agent loop</text>
  <text x="500" y="106" text-anchor="middle" font-size="19" fill="#4a5578">agents improve it, a judge decides, a person approves</text>

  <!-- MEMORY panel -->
  <rect x="30" y="160" width="440" height="350" rx="24" fill="#fff9e6" stroke="#eab530" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="125" y="136" width="250" height="50" rx="25" fill="#ffd95c" stroke="#1d2b4f" stroke-width="2.2"/>
  <text x="250" y="170" text-anchor="middle" font-size="27" font-weight="800" fill="#1d2b4f">MEMORY</text>
  <text x="250" y="218" text-anchor="middle" font-size="18" fill="#3a3320">shared state both agents read and write</text>

  <text x="56" y="252" font-size="16" fill="#3a3320">ledger: one row per measurement</text>
  <g stroke="#1d2b4f" stroke-width="1.6">
    <rect x="56" y="262" width="46" height="34" fill="#ffd95c"/><rect x="102" y="262" width="46" height="34" fill="#ffd95c"/>
    <rect x="148" y="262" width="46" height="34" fill="#ffd95c"/><rect x="194" y="262" width="46" height="34" fill="#ffd95c"/>
    <rect x="240" y="262" width="46" height="34" fill="#ffd95c"/><rect x="286" y="262" width="46" height="34" fill="#ffd95c"/>
    <rect x="332" y="262" width="46" height="34" fill="#ffd95c"/><rect x="378" y="262" width="62" height="34" fill="#ffffff"/>
  </g>
  <path d="M388 279 H424" stroke="#1d2b4f" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>

  <rect x="56" y="318" width="388" height="52" rx="12" fill="#ffffff" stroke="#e89a3c" stroke-width="2"/>
  <text x="72" y="341" font-size="17" font-weight="700" fill="#1d2b4f">GitHub: edshield</text>
  <text x="72" y="361" font-size="15" fill="#4d4630">rules, model code, candidate branches</text>

  <rect x="56" y="380" width="388" height="52" rx="12" fill="#ffffff" stroke="#e89a3c" stroke-width="2"/>
  <text x="72" y="403" font-size="17" font-weight="700" fill="#1d2b4f">GitHub: edshield-evidence</text>
  <text x="72" y="423" font-size="15" fill="#4d4630">reports, ledger, pass marks, sealed sets</text>

  <rect x="56" y="442" width="388" height="52" rx="12" fill="#ffe9c2" stroke="#e89a3c" stroke-width="2"/>
  <text x="72" y="465" font-size="17" font-weight="700" fill="#1d2b4f">On the PC only, never uploaded</text>
  <text x="72" y="485" font-size="15" fill="#4d4630">680 real essays, model checkpoints</text>

  <!-- TOOLS panel -->
  <rect x="530" y="160" width="440" height="350" rx="24" fill="#f1f6ff" stroke="#4a82dc" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="625" y="136" width="250" height="50" rx="25" fill="#a9c9f7" stroke="#1d2b4f" stroke-width="2.2"/>
  <text x="750" y="170" text-anchor="middle" font-size="27" font-weight="800" fill="#1d2b4f">TOOLS</text>
  <text x="750" y="218" text-anchor="middle" font-size="18" fill="#1f2d4d">run, then read what came back</text>

  <!-- tool icon: shield -->
  <g transform="translate(590 240)">
    <path d="M30 0 L58 10 V34 C58 52 46 64 30 70 C14 64 2 52 2 34 V10 Z" fill="#ffffff" stroke="#1d2b4f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M17 35 L27 45 L44 24" fill="none" stroke="#3b78d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="620" y="336" text-anchor="middle" font-size="18" font-weight="600" fill="#2a63c4">edshield</text>
  <!-- tool icon: clipboard with bars -->
  <g transform="translate(720 240)">
    <rect x="4" y="6" width="52" height="64" rx="6" fill="#ffffff" stroke="#1d2b4f" stroke-width="2.4"/>
    <rect x="20" y="0" width="20" height="12" rx="4" fill="#a9c9f7" stroke="#1d2b4f" stroke-width="2"/>
    <rect x="14" y="44" width="8" height="16" fill="#3b78d8"/><rect x="26" y="32" width="8" height="28" fill="#3b78d8"/><rect x="38" y="22" width="8" height="38" fill="#f0b030"/>
  </g>
  <text x="750" y="336" text-anchor="middle" font-size="18" font-weight="600" fill="#2a63c4">bench</text>
  <!-- tool icon: chip -->
  <g transform="translate(850 240)">
    <rect x="10" y="10" width="40" height="50" rx="6" fill="#ffe08a" stroke="#1d2b4f" stroke-width="2.4"/>
    <rect x="21" y="23" width="18" height="24" rx="3" fill="#ffffff" stroke="#1d2b4f" stroke-width="2"/>
    <path d="M0 22 H10 M0 35 H10 M0 48 H10 M50 22 H60 M50 35 H60 M50 48 H60" stroke="#1d2b4f" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="880" y="336" text-anchor="middle" font-size="18" font-weight="600" fill="#2a63c4">GPU training</text>

  <rect x="552" y="368" width="150" height="44" rx="9" fill="#ffffff" stroke="#3b78d8" stroke-width="2"/>
  <text x="627" y="396" text-anchor="middle" font-size="16" fill="#1d2b4f">{ set, candidate }</text>
  <path d="M706 390 H734" stroke="#3b78d8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-blue)"/>
  <rect x="740" y="368" width="116" height="44" rx="9" fill="#a9c9f7" stroke="#3b78d8" stroke-width="2"/>
  <text x="798" y="396" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2b4f">baseline.sh</text>
  <path d="M860 390 H886" stroke="#3b78d8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-blue)"/>
  <!-- judge: scales -->
  <g transform="translate(896 362)" stroke="#1d2b4f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 4 V52 M12 52 H44 M6 14 H50"/>
    <path d="M6 14 L0 32 H12 Z M50 14 L44 32 H56 Z" fill="#ffffff"/>
  </g>
  <text x="924" y="436" text-anchor="middle" font-size="16" fill="#2a63c4">judge</text>
  <rect x="740" y="446" width="116" height="42" rx="9" fill="#ffffff" stroke="#3b78d8" stroke-width="2"/>
  <text x="798" y="473" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2b4f">verdict</text>
  <path d="M924 444 C924 466 900 468 862 468" stroke="#3b78d8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-blue)"/>

  <!-- THE AGENT LOOP -->
  <text x="500" y="560" text-anchor="middle" font-size="25" font-weight="800" fill="#c8362f">THE AGENT LOOP</text>
  <rect x="330" y="578" width="340" height="46" rx="12" fill="#e2f4dc" stroke="#4ea85f" stroke-width="2"/>
  <text x="500" y="608" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2b4f">ready for the sealed set</text>
  <path d="M500 648 V631" stroke="#2f8f4e" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="500" y="668" text-anchor="middle" font-size="17" fill="#1d2b4f">stop: pass mark reached · 12 experiments · 20 GPU-hours</text>

  <ellipse cx="500" cy="850" rx="262" ry="166" fill="#fffaf2" stroke="#e8923a" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="500" cy="838" r="120" fill="#fde5cb" stroke="#e8923a" stroke-width="2.4"/>
  <g transform="translate(462 738)" stroke="#1d2b4f" stroke-width="2" stroke-linecap="round">
    <path d="M30 20 H46" stroke-dasharray="3 4" fill="none"/>
    <path d="M15 8 V2" fill="none"/><circle cx="15" cy="2" r="2.6" fill="#1d2b4f"/>
    <rect x="0" y="8" width="30" height="24" rx="7" fill="#f6a5b4"/>
    <circle cx="10" cy="20" r="2.4" fill="#1d2b4f"/><circle cx="20" cy="20" r="2.4" fill="#1d2b4f"/>
    <path d="M61 8 V2" fill="none"/><circle cx="61" cy="2" r="2.6" fill="#1d2b4f"/>
    <rect x="46" y="8" width="30" height="24" rx="7" fill="#a9c9f7"/>
    <circle cx="56" cy="20" r="2.4" fill="#1d2b4f"/><circle cx="66" cy="20" r="2.4" fill="#1d2b4f"/>
  </g>
  <text x="500" y="822" text-anchor="middle" font-size="40" font-weight="800" fill="#1d2b4f">AGENTS</text>
  <text x="500" y="848" text-anchor="middle" font-size="19" fill="#1d2b4f">diagnose + plan</text>
  <rect x="408" y="862" width="86" height="32" rx="8" fill="#ffffff" stroke="#e8923a" stroke-width="1.8"/>
  <text x="451" y="884" text-anchor="middle" font-size="16" fill="#1d2b4f">cloud</text>
  <rect x="506" y="862" width="86" height="32" rx="8" fill="#ffffff" stroke="#e8923a" stroke-width="1.8"/>
  <text x="549" y="884" text-anchor="middle" font-size="16" fill="#1d2b4f">PC + GPU</text>
  <text x="500" y="918" text-anchor="middle" font-size="13" fill="#5a4a36">two Claude Code sessions</text>

  <rect x="92" y="800" width="178" height="76" rx="10" fill="#ffffff" stroke="#e8923a" stroke-width="2.2"/>
  <text x="181" y="832" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2b4f">Read report</text>
  <text x="181" y="858" text-anchor="middle" font-size="14" fill="#5a4a36">what still gets through</text>
  <path d="M274 838 H372" stroke="#e8923a" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-orange)"/>

  <rect x="730" y="800" width="178" height="76" rx="10" fill="#ffffff" stroke="#e8923a" stroke-width="2.2"/>
  <text x="819" y="832" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2b4f">Change it</text>
  <text x="819" y="858" text-anchor="middle" font-size="14" fill="#5a4a36">rules · text · retrain</text>
  <path d="M628 838 H724" stroke="#e8923a" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-orange)"/>

  <rect x="352" y="982" width="296" height="42" rx="12" fill="#f7c58d" stroke="#1d2b4f" stroke-width="2.2"/>
  <text x="500" y="1010" text-anchor="middle" font-size="21" font-weight="800" fill="#1d2b4f">Measure again</text>
  <path d="M800 880 C800 960 740 996 656 998" stroke="#e8923a" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-orange)"/>
  <path d="M346 998 C262 996 181 960 181 884" stroke="#e8923a" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-orange)"/>

  <path d="M181 792 V518" stroke="#2f8f4e" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-start="url(#s-green)" marker-end="url(#a-green)"/>
  <text x="193" y="640" font-size="18" font-weight="600" fill="#2f8f4e">reports</text>
  <path d="M790 794 V518" stroke="#3b78d8" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-blue)"/>
  <text x="780" y="640" text-anchor="end" font-size="18" font-weight="600" fill="#3b78d8">run</text>
  <path d="M936 518 V1004 Q936 1016 924 1016 H658" stroke="#3b78d8" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-blue)"/>
  <text x="926" y="640" text-anchor="end" font-size="18" font-weight="600" fill="#3b78d8">results</text>
  <path d="M346 1014 H16 V400 H25" stroke="#e8923a" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-orange)"/>
  <text x="60" y="1004" font-size="18" font-weight="600" fill="#1d2b4f">store</text>
  <path d="M868 880 V1102" stroke="#cf3b3b" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#a-red)"/>
  <text x="856" y="1070" text-anchor="end" font-size="18" font-weight="700" fill="#cf3b3b">gate</text>

  <!-- GUARDRAILS panel -->
  <rect x="30" y="1112" width="940" height="232" rx="24" fill="#f5efff" stroke="#8a63d2" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="340" y="1088" width="320" height="50" rx="25" fill="#b7a0ec" stroke="#1d2b4f" stroke-width="2.2"/>
  <text x="500" y="1122" text-anchor="middle" font-size="27" font-weight="800" fill="#1d2b4f">GUARDRAILS</text>
  <text x="500" y="1166" text-anchor="middle" font-size="18" fill="#2c2350">no change counts until it has passed every gate</text>

  <rect x="52" y="1198" width="130" height="56" rx="10" fill="#ffffff" stroke="#8a63d2" stroke-width="2.2"/>
  <text x="117" y="1233" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2b4f">candidate</text>
  <path d="M186 1226 H212" stroke="#7b55c7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)"/>
  <polygon points="290,1182 362,1226 290,1270 218,1226" fill="#e6dbfb" stroke="#8a63d2" stroke-width="2.2"/>
  <text x="290" y="1232" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2b4f">judge</text>
  <text x="300" y="1291" font-size="13" fill="#4b3f78">pinned, task-blind</text>
  <path d="M290 1270 V1316" stroke="#7b55c7" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <path d="M366 1226 H392" stroke="#7b55c7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)"/>
  <polygon points="470,1182 542,1226 470,1270 398,1226" fill="#e6dbfb" stroke="#8a63d2" stroke-width="2.2"/>
  <text x="470" y="1232" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2b4f">no worse</text>
  <text x="480" y="1291" font-size="13" fill="#4b3f78">than the release</text>
  <path d="M470 1270 V1316" stroke="#7b55c7" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <path d="M546 1226 H572" stroke="#7b55c7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)"/>
  <polygon points="650,1182 722,1226 650,1270 578,1226" fill="#e6dbfb" stroke="#8a63d2" stroke-width="2.2"/>
  <text x="650" y="1232" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2b4f">sealed set</text>
  <text x="660" y="1291" font-size="13" fill="#4b3f78">one use each</text>
  <path d="M650 1270 V1316" stroke="#7b55c7" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <path d="M726 1226 H752" stroke="#7b55c7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)"/>
  <polygon points="830,1182 902,1226 830,1270 758,1226" fill="#e6dbfb" stroke="#8a63d2" stroke-width="2.2"/>
  <text x="830" y="1232" text-anchor="middle" font-size="19" font-weight="600" fill="#1d2b4f">Hemang</text>
  <text x="840" y="1291" font-size="13" fill="#4b3f78">merge, pass marks</text>
  <path d="M830 1270 V1316" stroke="#7b55c7" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <path d="M906 1226 H946" stroke="#2f8f4e" stroke-width="2.2" stroke-dasharray="6 5" fill="none" marker-end="url(#a-green)"/>

  <path d="M830 1316 H284" stroke="#7b55c7" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#a-purple)"/>
  <rect x="52" y="1300" width="226" height="32" rx="9" fill="#ffffff" stroke="#8a63d2" stroke-width="2"/>
  <path d="M68 1309 L82 1323 M82 1309 L68 1323" stroke="#6a3fc0" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <text x="92" y="1322" font-size="16" font-weight="700" fill="#6a3fc0">fail: back to diagnose</text>
</svg>
